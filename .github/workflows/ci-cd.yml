name: CI/CD Pipeline - Muslim Daily SuperApp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run ESLint & TypeScript Compilation Check
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build & Type-Check Serverless Cloud Functions
        run: |
          cd functions
          npm install
          npm run build

      - name: Build Application
        env:
          NODE_ENV: production
        run: npm run build

  deploy:
    name: Deploy to Firebase Hosting
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Production Assets
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Check Firebase Service Account Secret
        id: check_secret
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::notice ::FIREBASE_SERVICE_ACCOUNT secret is not configured in GitHub repository secrets. Skipping Firebase deployment."
            echo "has_secret=false" >> $GITHUB_OUTPUT
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Firebase Hosting
        if: steps.check_secret.outputs.has_secret == 'true'
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID || "gen-lang-client-0725368052" }}'

      - name: Deploy to Firebase Cloud Functions
        if: steps.check_secret.outputs.has_secret == 'true'
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || "gen-lang-client-0725368052" }}
        run: |
          cd functions
          npm install
          npm run build
          cd ..
          npx firebase-tools deploy --only functions --project "$FIREBASE_PROJECT_ID"

  deploy-github-pages:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup GitHub Pages Configuration
        uses: actions/configure-pages@v5

      - name: Build Application for GitHub Pages
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /muslim-daily-superapp/
        run: npm run build

      - name: Ensure SPA 404 and .nojekyll exist
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages (Actions Source)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages Branch (Branch Source Fallback)
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          force_orphan: true

